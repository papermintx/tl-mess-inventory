<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00acc1" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d47a1" stop-opacity="0.4" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="450" fill="url(#bgGrad)" />
  <rect width="600" height="450" fill="url(#grid)" />

  <!-- Subtle glow circle -->
  <circle cx="300" cy="190" r="140" fill="#00acc1" opacity="0.08" filter="blur(30px)" />

  <!-- Center Card / Icon Box -->
  <g transform="translate(300, 190)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-dasharray="6 4" opacity="0.6"/>
    <!-- Icon Container -->
    <rect x="-48" y="-48" width="96" height="96" rx="24" fill="url(#badgeGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" />
    
    <!-- Camera / Cube Inventory Icon -->
    <g transform="translate(-24, -24)" stroke="#38bdf8" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z" transform="scale(2) translate(0.5, 0.5)"/>
      <circle cx="24" cy="26" r="8"/>
    </g>
  </g>

  <!-- Watermark Tag -->
  <g transform="translate(300, 310)">
    <!-- Pill Background -->
    <rect x="-110" y="-16" width="220" height="32" rx="16" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
    <text x="0" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="1.5">
      FOTO BELUM DIUNGGAH
    </text>
  </g>

  <!-- Subtitle Text -->
  <text x="300" y="365" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="0.5">
    Mess Tanjung Lesung — Inventaris Aset
  </text>
  <text x="300" y="388" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="400" fill="#64748b" text-anchor="middle">
    Placeholder Visual • Dokumentasi Fisik Lapangan
  </text>
</svg>

